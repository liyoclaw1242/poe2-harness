[project]
name = "pob-agent"
version = "0.1.0"
description = "Agent harness for Path of Building (PoE2): headless calc, build audit, ramp analysis, PoB-only skill scan, trade queries"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
pob-agent = "pob_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness/pob_agent"]
